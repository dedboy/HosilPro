{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow p-4 border-0">
            <h2 class="text-center mb-4 fw-bold">Tizimga kirish</h2>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Foydalanuvchi nomi</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Parol</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100 mt-3">Kirish</button>
            </form>
            <hr>
            <p class="text-center small">Profilingiz yo'qmi? <a href="{% url 'users:register' %}" class="text-success">Ro'yxatdan o'ting</a></p>
        </div>
    </div>
</div>
{% endblock %}
