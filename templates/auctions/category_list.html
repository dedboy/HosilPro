{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2 class="fw-bold mb-4"><i class="bi bi-grid-3x3-gap text-success"></i> Mahsulot kategoriyalari</h2>
    
    <div class="row">
        {% for category in categories %}
        <div class="col-md-4 mb-4">
            <div class="card h-100 shadow-sm border-0 hover-shadow transition">
                <div class="card-body text-center py-5">
                    <div class="display-4 text-success mb-3">
                        <i class="bi bi-box-seam"></i>
                    </div>
                    <h4 class="fw-bold">{{ category.name }}</h4>
                    <p class="text-muted">{{ category.product_count }} ta faol auksion</p>
                    <a href="{% url 'product_list' %}?category={{ category.id }}" class="btn btn-outline-success stretched-link">
                        Ko'rish
                    </a>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12 text-center py-5">
            <p class="text-muted">Hozircha kategoriyalar mavjud emas.</p>
        </div>
        {% endfor %}
    </div>
</div>

<style>
    .hover-shadow:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important;
    }
    .transition { transition: 0.3s; }
</style>
{% endblock %}
