{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4 text-center">Joriy Auksionlar</h2>
<div class="row">
    {% for product in products %}
    <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm">
            {% if product.image %}
            <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.title }}"
                 style="height: 200px; object-fit: cover;">
            {% endif %}
            <div class="card-body">
                <h5 class="card-title">{{ product.title }}</h5>
                <p class="text-muted small">{{ product.description|truncatewords:10 }}</p>
                <div class="d-flex justify-content-between align-items-center">
                    <span class="badge bg-warning text-dark fs-6">
                        {{ product.current_price|default:product.start_price }} so'm
                    </span>
                    <a href="{% url 'product_detail' product.pk %}" class="btn btn-sm btn-outline-success">Batafsil</a>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
