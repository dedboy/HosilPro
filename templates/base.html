<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>HosilPro - Qishloq xo'jaligi auksioni</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">HOSIL PRO</a>
        <div class="navbar-nav ms-auto align-items-center">
            {% if user.is_authenticated %}
                <a class="btn btn-warning btn-sm me-3 fw-bold" href="{% url 'product_create' %}">+ E'lon berish</a>
                <span class="nav-link text-white me-2">Salom, {{ user.username }}!</span>
                <a class="nav-link" href="{% url 'logout' %}">Chiqish</a>
            {% else %}
                <a class="nav-link" href="{% url 'login' %}">Kirish</a>
                <a class="nav-link" href="{% url 'register' %}">Ro'yxatdan o'tish</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container">
    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">
        {{ message }}
    </div>
    {% endfor %}
    {% endif %}

    {% block content %} {% endblock %}
</div>
<footer class="text-center mt-5 py-3 border-top">
    <p>&copy; 2026 HosilPro Startup Project</p>
</footer>
</body>
</html>
